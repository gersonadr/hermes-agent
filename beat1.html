<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beat 1 — From Zero</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0c18;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script>
'use strict';

const W = 1280, H = 720;
const app = new PIXI.Application({
  width: W, height: H, backgroundColor: 0x0d0c18, antialias: true,
});
document.body.appendChild(app.view);

const resize = () => {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  app.view.style.width  = Math.round(W * s) + 'px';
  app.view.style.height = Math.round(H * s) + 'px';
};
resize();
window.addEventListener('resize', resize);

const stage = app.stage;

// ── Palette ────────────────────────────────────────────────────────────────
const C = {
  panel:   0x10101f,
  border:  0x1f1e38,
  hdr:     0x181730,
  userBg:  0x162840,
  userTxt: 0x7aaed4,
  toolTxt: 0x4d6680,
  dot:     0x3a7090,
  check:   0x3daa78,
  amber:   0xFFAA22,
  text:    0xd8d8ee,
  muted:   0x3d4a60,
  white:   0xffffff,
};

// ── Text factory ───────────────────────────────────────────────────────────
const T = (size, fill = C.text, mono = false, opts = {}) =>
  new PIXI.TextStyle({
    fontFamily: mono
      ? '"Courier New", monospace'
      : '"Georgia", "Times New Roman", serif',
    fontSize: size, fill,
    fontWeight: opts.bold ? '700' : '300',
    fontStyle:  opts.italic ? 'italic' : 'normal',
    letterSpacing: opts.ls || 0,
    align: opts.align || 'left',
    wordWrap: !!opts.wrap, wordWrapWidth: opts.wrap || 500,
  });

// ── Panel geometry ─────────────────────────────────────────────────────────
const PW = 620, PH = 460;
const PX = (W - PW) / 2, PY = (H - PH) / 2 - 24;
const HDR_H = 38;
const CONTENT_TOP = PY + HDR_H + 14;

// ── Panel container ────────────────────────────────────────────────────────
const panel = new PIXI.Container();
panel.alpha = 0;
stage.addChild(panel);

// background + header
const pbg = new PIXI.Graphics();
pbg.lineStyle(1, C.border, 1);
pbg.beginFill(C.panel, 1);
pbg.drawRoundedRect(PX, PY, PW, PH, 8);
pbg.endFill();
pbg.beginFill(C.hdr, 1);
pbg.drawRoundedRect(PX + 1, PY + 1, PW - 2, HDR_H - 1, 7);
pbg.endFill();
panel.addChild(pbg);

// Traffic-light dots (decorative, 3B1B chat window feel)
[0xcc4444, 0xccaa22, 0x44aa66].forEach((col, i) => {
  const dot = new PIXI.Graphics();
  dot.beginFill(col, 0.6);
  dot.drawCircle(PX + 16 + i * 18, PY + HDR_H / 2, 5);
  dot.endFill();
  panel.addChild(dot);
});

// Session label (right side of header)
const sessionLabel = new PIXI.Text('Session 1', T(13, C.muted, true));
sessionLabel.anchor.set(1, 0.5);
sessionLabel.x = PX + PW - 14;
sessionLabel.y = PY + HDR_H / 2;
panel.addChild(sessionLabel);

// ── User message bubble (shared across sessions) ───────────────────────────
const USER_MSG = 'Set up my fine-tuning run';
const umsg = new PIXI.Container();
umsg.alpha = 0;
panel.addChild(umsg);

const umsgText = new PIXI.Text(USER_MSG, T(17, C.userTxt));
umsgText.x = 0; umsgText.y = 0;

const ubw = umsgText.width + 26, ubh = umsgText.height + 18;
const ubg = new PIXI.Graphics();
ubg.beginFill(C.userBg, 1);
ubg.drawRoundedRect(0, 0, ubw, ubh, 6);
ubg.endFill();
umsg.addChild(ubg);
umsgText.x = 13; umsgText.y = 9;
umsg.addChild(umsgText);

// Right-align the bubble
umsg.x = PX + PW - ubw - 18;
umsg.y = CONTENT_TOP;

// ── Tool call row builder ──────────────────────────────────────────────────
const ROW_H = 29;

function buildToolRow(label, parentContainer, idx) {
  const row = new PIXI.Container();
  row.x = PX + 18;
  row.y = CONTENT_TOP + ubh + 16 + idx * ROW_H;
  row.alpha = 0;

  // indicator dot
  const dot = new PIXI.Graphics();
  dot.beginFill(C.dot, 0.9);
  dot.drawCircle(5, 9, 3.5);
  dot.endFill();
  row.addChild(dot);

  // label
  const txt = new PIXI.Text(label, T(15, C.toolTxt, true));
  txt.x = 16; txt.y = 1;
  row.addChild(txt);

  // check (hidden)
  const chk = new PIXI.Text('✓', T(13, C.check));
  chk.x = txt.x + txt.width + 10;
  chk.y = 1;
  chk.alpha = 0;
  row.addChild(chk);

  parentContainer.addChild(row);
  return { row, chk };
}

// ── Long tool list (sessions 1 + 2) ───────────────────────────────────────
const LONG_STEPS = [
  'reading config.yaml',
  'checking GPU availability',
  'installing dependencies',
  'preparing dataset',
  'configuring batch size',
  'setting optimizer lr=2e-4',
  'initializing run logger',
  'launching training loop',
];
const longLayer = new PIXI.Container();
panel.addChild(longLayer);
const longRows = LONG_STEPS.map((lbl, i) => buildToolRow(lbl, longLayer, i));

// ── Short tool list (session 3, with SKILL.md) ─────────────────────────────
const SHORT_STEPS = [
  'loading  SKILL.md',
  'launching training loop',
  'monitoring loss curve',
];
const shortLayer = new PIXI.Container();
shortLayer.alpha = 0;
panel.addChild(shortLayer);
const shortRows = SHORT_STEPS.map((lbl, i) => buildToolRow(lbl, shortLayer, i));

// ── SKILL.md card ──────────────────────────────────────────────────────────
const skillCard = new PIXI.Container();
skillCard.alpha = 0;
stage.addChild(skillCard);

const scbg = new PIXI.Graphics();
scbg.lineStyle(1.5, C.amber, 0.8);
scbg.beginFill(C.amber, 0.07);
scbg.drawRoundedRect(-118, -38, 236, 76, 8);
scbg.endFill();
skillCard.addChild(scbg);

// Typing target for SKILL.md name
const skillName = new PIXI.Text('', T(22, C.amber, true, { bold: true, ls: 2 }));
skillName.anchor.set(0.5, 0.5);
skillName.y = -12;
skillCard.addChild(skillName);

const skillSub = new PIXI.Text('agent writes this at end of session', T(13, C.amber, false, { italic: true }));
skillSub.anchor.set(0.5, 0);
skillSub.y = 10;
skillCard.addChild(skillSub);

skillCard.x = W / 2;
skillCard.y = H / 2 + 10;

// ── Caption ────────────────────────────────────────────────────────────────
const caption = new PIXI.Text('', T(26, C.text, false, {
  italic: true, align: 'center', wrap: 740,
}));
caption.anchor.set(0.5, 0.5);
caption.x = W / 2;
caption.y = 658;
caption.alpha = 0;
stage.addChild(caption);

// ── Full-screen overlay for wipes ──────────────────────────────────────────
const overlay = new PIXI.Graphics();
overlay.beginFill(0x0d0c18, 1);
overlay.drawRect(0, 0, W, H);
overlay.endFill();
overlay.alpha = 0;
// overlay goes on top of everything
stage.addChild(overlay);

// ── Typing helper ──────────────────────────────────────────────────────────
function typeInto(tl, textObj, fullStr, duration, position) {
  const proxy = { n: 0 };
  tl.to(proxy, {
    n: fullStr.length, duration, ease: 'none',
    onUpdate() { textObj.text = fullStr.slice(0, Math.round(proxy.n)); },
  }, position);
}

// ═══════════════════════════════════════════════════════════════════════════
// TIMELINE
// ═══════════════════════════════════════════════════════════════════════════
const tl = gsap.timeline({ defaults: { ease: 'power2.inOut' } });

// ── Phase 1: Panel + user message appear ──────────────────────────────────
tl.to(panel, { alpha: 1, duration: 0.7 }, 0.5);
tl.to(umsg,  { alpha: 1, duration: 0.5 }, 0.9);

// ── Phase 2: Session 1 — tool calls stream in ─────────────────────────────
longRows.forEach(({ row, chk }, i) => {
  const pos = i === 0 ? '+=0.55' : '+=0.30';
  tl.to(row, { alpha: 1, duration: 0.22 }, pos);
  // last row gets a check after a beat
  if (i === longRows.length - 1) {
    tl.to(chk, { alpha: 1, duration: 0.25 }, '+=0.25');
  }
});

tl.to({}, { duration: 0.6 }); // breathe

// ── Wipe → Session 2 ──────────────────────────────────────────────────────
tl.to(overlay, { alpha: 1, duration: 0.45 });

tl.call(() => {
  sessionLabel.text = 'Session 2';
  longRows.forEach(({ row, chk }) => {
    row.alpha = 0;
    chk.alpha = 0;
  });
});

tl.to(overlay, { alpha: 0, duration: 0.45 }, '+=0.2');

// ── Phase 3: Session 2 — same steps again (only show first 5, let it hang) ─
longRows.slice(0, 5).forEach(({ row }, i) => {
  tl.to(row, { alpha: 1, duration: 0.22 }, i === 0 ? '+=0.45' : '+=0.28');
});

// Caption drops in while the 5th step is still "running"
tl.to(caption, {
  alpha: 1, duration: 0.7,
  onStart() { caption.text = 'Every session. From zero.'; },
}, '+=0.5');

tl.to({}, { duration: 2.2 }); // let the pain breathe

// ── Phase 4: The turn — SKILL.md appears ──────────────────────────────────
tl.to(caption,  { alpha: 0, duration: 0.4 });
tl.to(panel,    { alpha: 0.1, duration: 0.7 }, '-=0.2');
tl.to(skillCard, { alpha: 1, duration: 0.6, ease: 'power3.out' }, '+=0.15');

// Type the filename in
typeInto(tl, skillName, 'SKILL.md', 0.55, '+=0.15');

tl.to(caption, {
  alpha: 1, duration: 0.6,
  onStart() { caption.text = 'Unless your agent keeps a playbook.'; },
}, '-=0.1');

tl.to({}, { duration: 2.0 });

// ── Wipe → Session 3 ──────────────────────────────────────────────────────
tl.to(caption,   { alpha: 0, duration: 0.35 });
tl.to(overlay,   { alpha: 1, duration: 0.45 }, '-=0.2');

tl.call(() => {
  sessionLabel.text = 'Session 3';
  longRows.forEach(({ row }) => { row.alpha = 0; });
  skillCard.alpha = 0;
  panel.alpha = 0;
});

tl.to(panel,    { alpha: 1, duration: 0.4 });
tl.to(shortLayer, { alpha: 1, duration: 0 }); // make shortLayer visible (rows still alpha=0)
tl.to(longLayer, { alpha: 0, duration: 0 });
tl.to(overlay,  { alpha: 0, duration: 0.45 }, '-=0.3');

// ── Phase 5: Session 3 — three steps, fast, each with a check ─────────────
shortRows.forEach(({ row, chk }, i) => {
  tl.to(row, { alpha: 1, duration: 0.22 }, i === 0 ? '+=0.4' : '+=0.32');
  tl.to(chk, { alpha: 1, duration: 0.2 },  '+=0.22');
});

// ── Caption: name it ──────────────────────────────────────────────────────
tl.to(caption, {
  alpha: 1, duration: 0.8,
  onStart() { caption.text = "That's procedural memory."; },
}, '+=0.5');

tl.to({}, { duration: 3 });
</script>
</body>
</html>
