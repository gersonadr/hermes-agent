<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beat 3 — Compounding</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0c18;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
<script>
'use strict';

const W = 1280, H = 720;
const app = new PIXI.Application({
  width: W, height: H, backgroundColor: 0x0d0c18, antialias: true,
});
document.body.appendChild(app.view);

const resize = () => {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  app.view.style.width  = Math.round(W * s) + 'px';
  app.view.style.height = Math.round(H * s) + 'px';
};
resize();
window.addEventListener('resize', resize);

const stage = app.stage;

// ── Palette ────────────────────────────────────────────────────────────────
const C = {
  bg:       0x0d0c18,
  amber:    0xFFAA22,
  amberDim: 0x7a4e10,
  settled:  0x2e3f55,
  border:   0x3d5268,
  text:     0xd6d6ea,
  muted:    0x334455,
  line:     0x1e2e40,
  lineLit:  0xFFAA22,
  capstone: 0xFFCC55,   // ship-feature gets warmer tone
};

const T = (size, fill, mono = false, opts = {}) =>
  new PIXI.TextStyle({
    fontFamily: mono
      ? '"Courier New", monospace'
      : '"Georgia", "Times New Roman", serif',
    fontSize: size, fill,
    fontWeight: opts.bold ? '700' : '300',
    fontStyle:  opts.italic ? 'italic' : 'normal',
    letterSpacing: opts.ls || 0,
    align: opts.align || 'center',
    wordWrap: !!opts.wrap, wordWrapWidth: opts.wrap || 700,
  });

// ── Graph definition ───────────────────────────────────────────────────────
//
//                     [ ship-feature ]            ← Layer 4
//                      /             \
//             [ code-review ]   [ deploy-staging ] ← Layer 3
//              /         \       /          \
//      [fix-test]   [trace-error]   [open-pr]     ← Layer 2
//          |               |            |
//      [run-tests]    [tail-logs]  [git-branch]   ← Layer 1
//

const PILL_W = 172, PILL_H = 34;

// Node: { id, label, layer, cx, cy }   (cx/cy = pill centre in canvas px)
const L1Y = 616, L2Y = 474, L3Y = 330, L4Y = 186;

const NODES = {
  // Layer 1 — primitives
  'run-tests':  { label: 'run-tests',  layer: 1, cx: 240,  cy: L1Y },
  'tail-logs':  { label: 'tail-logs',  layer: 1, cx: 640,  cy: L1Y },
  'git-branch': { label: 'git-branch', layer: 1, cx: 1040, cy: L1Y },

  // Layer 2 — diagnostics
  'fix-test':     { label: 'fix-test',     layer: 2, cx: 240,  cy: L2Y },
  'trace-error':  { label: 'trace-error',  layer: 2, cx: 640,  cy: L2Y },
  'open-pr':      { label: 'open-pr',      layer: 2, cx: 1040, cy: L2Y },

  // Layer 3 — workflows
  'code-review':    { label: 'code-review',    layer: 3, cx: 440, cy: L3Y },
  'deploy-staging': { label: 'deploy-staging', layer: 3, cx: 840, cy: L3Y },

  // Layer 4 — orchestration
  'ship-feature': { label: 'ship-feature', layer: 4, cx: 640, cy: L4Y, capstone: true },
};

// Edges: [sourceId, targetId]
const EDGES = [
  // L1 → L2  (straight vertical, same x)
  ['run-tests',  'fix-test'],
  ['tail-logs',  'trace-error'],
  ['git-branch', 'open-pr'],

  // L2 → L3  (converging diagonals)
  ['fix-test',    'code-review'],
  ['trace-error', 'code-review'],
  ['trace-error', 'deploy-staging'],
  ['open-pr',     'deploy-staging'],

  // L3 → L4
  ['code-review',    'ship-feature'],
  ['deploy-staging', 'ship-feature'],
];

// ── Build pill containers ──────────────────────────────────────────────────
const nodePills = {};   // id → Container

Object.entries(NODES).forEach(([id, n]) => {
  const c = new PIXI.Container();
  c.x = n.cx - PILL_W / 2;
  c.y = n.cy - PILL_H / 2 + 16;  // start below final pos (rise-in)
  c.alpha = 0;
  c._finalY = n.cy - PILL_H / 2;

  const isCapstone = !!n.capstone;
  const borderCol  = isCapstone ? C.capstone : C.amber;
  const fillAlpha  = isCapstone ? 0.14 : 0.09;
  const pillW      = isCapstone ? PILL_W + 20 : PILL_W;

  const bg = new PIXI.Graphics();
  bg.lineStyle(isCapstone ? 1.5 : 1, borderCol, 0.8);
  bg.beginFill(borderCol, fillAlpha);
  bg.drawRoundedRect(isCapstone ? -10 : 0, 0, pillW, PILL_H, 6);
  bg.endFill();
  c.addChild(bg);

  const txt = new PIXI.Text(n.label, T(isCapstone ? 16 : 14, borderCol, true, { bold: isCapstone }));
  txt.anchor.set(0.5, 0.5);
  txt.x = PILL_W / 2;
  txt.y = PILL_H / 2;
  c.addChild(txt);

  stage.addChild(c);
  nodePills[id] = c;
});

// ── Build connector lines ──────────────────────────────────────────────────
const edgeGraphics = [];   // { g, litG }  — dim version + bright version

const connLayer = new PIXI.Container();   // sits below pills
stage.addChildAt(connLayer, 0);

EDGES.forEach(([srcId, tgtId]) => {
  const src = NODES[srcId];
  const tgt = NODES[tgtId];

  // Line runs from top-centre of src pill to bottom-centre of tgt pill
  const x1 = src.cx, y1 = src.cy - PILL_H / 2;    // src top
  const x2 = tgt.cx, y2 = tgt.cy + PILL_H / 2;    // tgt bottom

  // Dim line (always visible once drawn)
  const g = new PIXI.Graphics();
  g.lineStyle(1, C.line, 1);
  g.moveTo(x1, y1);
  g.lineTo(x2, y2);
  g.alpha = 0;
  connLayer.addChild(g);

  // Lit line (amber, fades in on final pulse)
  const litG = new PIXI.Graphics();
  litG.lineStyle(1.5, C.lineLit, 0.7);
  litG.moveTo(x1, y1);
  litG.lineTo(x2, y2);
  litG.alpha = 0;
  connLayer.addChild(litG);

  edgeGraphics.push({ g, litG, src: srcId, tgt: tgtId });
});

// ── Layer label tags (left margin) ────────────────────────────────────────
const LAYER_LABELS = [
  { text: 'primitive',      y: L1Y, alpha: 0 },
  { text: 'diagnostic',     y: L2Y, alpha: 0 },
  { text: 'workflow',       y: L3Y, alpha: 0 },
  { text: 'orchestration',  y: L4Y, alpha: 0 },
];
const layerTags = LAYER_LABELS.map(({ text, y }) => {
  const t = new PIXI.Text(text, T(11, C.muted, true));
  t.anchor.set(1, 0.5);
  t.x = 72; t.y = y;
  t.alpha = 0;
  stage.addChild(t);
  return t;
});

// ── Caption ────────────────────────────────────────────────────────────────
const caption = new PIXI.Text('', T(28, C.text, false, {
  italic: true, align: 'center', wrap: 780,
}));
caption.anchor.set(0.5, 0.5);
caption.x = W / 2; caption.y = 662;
caption.alpha = 0;
stage.addChild(caption);

// ── Helpers ────────────────────────────────────────────────────────────────
function revealPill(tl, id, pos) {
  const p = nodePills[id];
  tl.to(p, { alpha: 1, y: p._finalY, duration: 0.45, ease: 'power2.out' }, pos);
}

function revealEdgesTo(tl, targetId, pos) {
  edgeGraphics
    .filter(e => e.tgt === targetId)
    .forEach(e => tl.to(e.g, { alpha: 1, duration: 0.4 }, pos));
}

// ═══════════════════════════════════════════════════════════════════════════
// TIMELINE
// ═══════════════════════════════════════════════════════════════════════════
const tl = gsap.timeline({ defaults: { ease: 'power2.inOut' } });

// ── Layer 1: primitives appear slowly ────────────────────────────────────
tl.to(layerTags[0], { alpha: 1, duration: 0.5 }, 0.5);
revealPill(tl, 'run-tests',  '+=0.6');
revealPill(tl, 'tail-logs',  '+=0.55');
revealPill(tl, 'git-branch', '+=0.55');

// ── Layer 2: lines draw, then diagnostics rise ────────────────────────────
tl.to(layerTags[1], { alpha: 1, duration: 0.4 }, '+=0.7');
revealEdgesTo(tl, 'fix-test',    '<');
revealEdgesTo(tl, 'trace-error', '<');
revealEdgesTo(tl, 'open-pr',     '<');

revealPill(tl, 'fix-test',    '+=0.3');
revealPill(tl, 'trace-error', '+=0.4');
revealPill(tl, 'open-pr',     '+=0.4');

// ── Layer 3: converging lines, workflow skills ─────────────────────────────
tl.to(layerTags[2], { alpha: 1, duration: 0.4 }, '+=0.7');
revealEdgesTo(tl, 'code-review',    '<');
revealEdgesTo(tl, 'deploy-staging', '<');

revealPill(tl, 'code-review',    '+=0.35');
revealPill(tl, 'deploy-staging', '+=0.45');

// ── Layer 4: final convergence to ship-feature ────────────────────────────
tl.to(layerTags[3], { alpha: 1, duration: 0.4 }, '+=0.8');
revealEdgesTo(tl, 'ship-feature', '<');

revealPill(tl, 'ship-feature', '+=0.4');

// ── Hold — let the graph breathe ──────────────────────────────────────────
tl.to({}, { duration: 1.4 });

// ── All lines pulse amber simultaneously ──────────────────────────────────
edgeGraphics.forEach(e => {
  tl.to(e.litG, { alpha: 1, duration: 0.5 }, '<');
});
tl.to({}, { duration: 0.6 });
edgeGraphics.forEach(e => {
  tl.to(e.litG, { alpha: 0, duration: 0.8 }, '<');
});

// ── Captions ─────────────────────────────────────────────────────────────
tl.to(caption, {
  alpha: 1, duration: 0.9,
  onStart() { caption.text = 'You taught it three things.'; },
}, '+=0.3');

tl.to({}, { duration: 2.4 });

tl.to(caption, { alpha: 0, duration: 0.4 });
tl.to(caption, {
  alpha: 1, duration: 0.9,
  onStart() { caption.text = 'It learned to ship features.'; },
}, '+=0.1');

tl.to({}, { duration: 3.0 });
</script>
</body>
</html>
